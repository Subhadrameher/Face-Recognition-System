{% extends "base.html" %}{% block sub %}Recognition runs only while the camera is on, and only for people who registered with consent.{% endblock %}
{% block body %}<div class="glass">
<div class="mb-3"><button class="btn btn-glow me-2" id="start"><i class="bi bi-camera-video"></i> Start Camera</button><button class="btn btn-outline-light" id="stop" disabled><i class="bi bi-stop-circle"></i> Stop Camera</button> <span id="state" class="ms-3 text-secondary"></span></div>
<div class="stage"><video id="v" autoplay playsinline muted width="640"></video><canvas class="ov" id="ov"></canvas></div><canvas id="grab" class="d-none"></canvas></div>{% endblock %}
{% block js %}<script>
let stream,timer,busy=false;
start.onclick=async()=>{
 if(!navigator.mediaDevices?.getUserMedia)return toast('This browser has no camera API. Use HTTPS or localhost.',false);
 try{stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});}
 catch(e){return toast(e.name==='NotAllowedError'?'Camera permission denied. Allow it in the browser address bar and retry.':e.name==='NotFoundError'?'No camera found.':'Camera error: '+e.message,false);}
 v.srcObject=stream;start.disabled=true;stop.disabled=false;msg.classList.add('d-none');state.textContent='Camera on (first frame may take a while while the model loads)';
 timer=setInterval(tick,900);};
async function tick(){ if(busy||!v.videoWidth)return; busy=true;
 grab.width=480;grab.height=Math.round(480*v.videoHeight/v.videoWidth);grab.getContext('2d').drawImage(v,0,0,grab.width,grab.height);
 try{const d=await api('/api/recognize-frame',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({frame:grab.toDataURL('image/jpeg',.8)})});drawBoxes(ov,d);state.textContent=d.faces.length+' face(s)';}
 catch(e){state.textContent=e.message;} busy=false;}
stop.onclick=()=>{clearInterval(timer);stream?.getTracks().forEach(t=>t.stop());v.srcObject=null;ov.getContext('2d').clearRect(0,0,ov.width,ov.height);start.disabled=false;stop.disabled=true;state.textContent='Camera off';};
</script>{% endblock %}
